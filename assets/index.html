<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Cadwork 3d WebView Demo</title>
    <style>
        body {
            font: 14px/1.5 system-ui, sans-serif;
            margin: 0;
            padding: 24px;
            color: #1f2937;
            background: #f8fafc;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 0.25rem;
        }

        p.lede {
            color: #475569;
            margin: 0 0 1.5rem;
            max-width: 56ch;
        }

        .status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: #fef3c7;
            color: #92400e;
            vertical-align: middle;
        }

        .status.ready {
            background: #dcfce7;
            color: #166534;
        }

        .row {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }

        button {
            padding: 10px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font: inherit;
        }

        button:hover {
            border-color: #6366f1;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        ul.elements {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: white;
            max-height: 320px;
            overflow: auto;
        }

        ul.elements li {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        ul.elements li:last-child {
            border-bottom: none;
        }

        ul.elements li:hover {
            background: #eef2ff;
        }

        ul.elements li .id {
            font: 12px ui-monospace, "Cascadia Code", Consolas, monospace;
            color: #6366f1;
            min-width: 4ch;
        }

        ul.elements li .name {
            color: #1f2937;
        }

        ul.elements li.empty {
            cursor: default;
            color: #94a3b8;
            font-style: italic;
        }

        ul.elements li.empty:hover {
            background: transparent;
        }
    </style>
</head>
<body>

<h1>Cadwork 3d WebView <span id="status" class="status">connecting...</span></h1>
<p class="lede">
    Click "Load active elements" to fetch the
    current selection from <code>cadwork 3d</code>; click any row to activate that
    element and zoom to it.
</p>

<div class="row">
    <button id="load" disabled>Load active elements</button>
</div>

<ul id="elements" class="elements">
    <li class="empty">No elements loaded yet.</li>
</ul>

<script>
    const statusEl = document.getElementById('status');
    const loadBtn = document.getElementById('load');
    const list = document.getElementById('elements');
    let cadwork = null;

    function renderEmpty(message) {
        list.innerHTML = '';
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = message;
        list.appendChild(li);
    }

    function renderElements(elements) {
        list.innerHTML = '';
        if (!elements.length) {
            renderEmpty('No active elements in the current cadwork selection.');
            return;
        }

        elements.forEach(el => {
            const li = document.createElement('li');
            li.dataset.id = String(el.id);
            li.appendChild(createIdSpan(el.id));
            li.appendChild(createNameSpan(el.name));
            list.appendChild(li);
        });
    }

    function createIdSpan(id) {
        const span = document.createElement('span');
        span.className = 'id';
        span.textContent = '#' + id;
        return span;
    }

    function createNameSpan(name) {
        const span = document.createElement('span');
        span.className = 'name';
        span.textContent = name || '(unnamed)';
        return span;
    }

    list.addEventListener('click', (event) => {
        const li = event.target.closest('li[data-id]');
        if (!li || !cadwork) return;
        cadwork.activateAndZoom(parseInt(li.dataset.id, 10));
    });

    loadBtn.addEventListener('click', async () => {
        const elements = await cadwork.getActiveElements();
        renderElements(elements);
    });

    new QWebChannel(qt.webChannelTransport, function (channel) {
        cadwork = channel.objects.cadwork;
        statusEl.textContent = 'bridge ready';
        statusEl.classList.add('ready');
        loadBtn.disabled = false;
    });
</script>

</body>
</html>
